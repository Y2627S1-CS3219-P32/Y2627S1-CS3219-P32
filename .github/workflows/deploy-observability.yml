# Builds and deploys only the Cloud Run observability stack.
name: Deploy Observability Stack

on:
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy script syntax
        run: bash -n deploy.sh

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          install_components: beta

      - name: Build and push observability images
        id: build
        run: |
          build_id="$(gcloud builds submit --config cloudbuild-observability.yaml --region "$REGION" --async --format 'value(id)')"
          echo "Cloud Build: https://console.cloud.google.com/cloud-build/builds;region=${REGION}/${build_id}?project=${PROJECT_ID}"
          while :; do
            status="$(gcloud builds describe "$build_id" --region "$REGION" --format 'value(status)')"
            case "$status" in
              SUCCESS) break ;;
              QUEUED|PENDING|WORKING) sleep 15 ;;
              *)
                gcloud builds log "$build_id" --region "$REGION" || true
                echo "::error::Cloud Build $build_id finished with status $status"
                exit 1
                ;;
            esac
          done
          echo "tag=$build_id" >> "$GITHUB_OUTPUT"


      - name: Deploy observability only
        run: ./deploy.sh observability
        env:
          TAG: ${{ steps.build.outputs.tag }}
          OBSERVABILITY: "on"
