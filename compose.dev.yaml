# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-09-29.
# Scope: Development override with hot reloading via Compose watch.
# Author review: Check for correctness.
#
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build --watch
#
# Claude Code (Opus 5.5), 2026-11-04: backend services sync shared/src into src/shared and log through
# pino-pretty (LOG_PRETTY). Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-04: tsx loads the OpenTelemetry bootstrap first; it stays off
# unless compose.observability.yaml is added too. Author review: Pending.
services:
  supplier-service:
    build:
      target: tooling
    command: ["npx", "tsx", "watch", "--import", "./src/shared/telemetry.mts", "src/index.ts"]
    environment:
      LOG_PRETTY: "true"
    develop:
      watch:
        - action: sync
          path: ./supplier-service/src
          target: /app/src
          ignore:
            - shared/
        - action: sync
          path: ./shared/src
          target: /app/src/shared
        - action: rebuild
          path: ./supplier-service/package.json

  # Claude Code (Opus 5.5), 2026-10-18: supplier event worker hot reloading. Author review: Pending.
  supplier-event-worker:
    build:
      target: tooling
