  frontend-service:
    build:
      target: build
    command: ["npx", "nuxt", "dev", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./frontend-service
          target: /app
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
            - .data/
        - action: rebuild
          path: ./frontend-service/package.json

