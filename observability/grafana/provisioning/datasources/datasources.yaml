# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-11-04.
# Scope: Grafana data sources for Prometheus, Loki and Tempo, linked so traces, logs and
# metrics jump to one another. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: Mimir in place of Prometheus; hosts from the
# environment (observability/Dockerfile sets the local defaults, deploy.sh the Cloud Run
# values). Author review: Pending.
# `$$` escapes Grafana's environment-variable expansion in provisioning files.
apiVersion: 1

# The data source Mimir replaced, still in Grafana databases created before it.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # Mimir answers Prometheus queries under /prometheus.
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://${MIMIR_HOST}:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://${LOKI_HOST}:3100
    jsonData:
      derivedFields:
        # OTLP logs carry trace_id as structured metadata, not in the line.
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://${TEMPO_HOST}:3200
    jsonData:
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      search:
        hide: false
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        customQuery: false
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
      lokiSearch:
        datasourceUid: loki
