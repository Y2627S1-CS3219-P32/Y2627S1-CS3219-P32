# Scope: Local Prometheus: OTLP and remote-write ingestion, self and collector scrapes.
# Author review: Pending.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Metrics arrive late and out of order through the collector's batches.
storage:
  tsdb:
    out_of_order_time_window: 30m

# Copy these OTLP resource attributes onto every series as labels.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - service.version
    - deployment.environment.name
    - container.name
    # Set by the collector's docker_stats receiver from Compose's container labels.
    - compose_service
    - compose_project

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
