# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-11-04.
# Scope: Local OpenTelemetry Collector pipeline: OTLP in; traces to Tempo, metrics to
# Prometheus, logs to Loki; Docker container metrics. Author review: Pending.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # CPU, memory, network and block I/O per container, labelled by Compose service, so
  # there is something to look at before any service is instrumented.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    api_version: "1.44"
    container_labels_to_metric_labels:
      com.docker.compose.service: compose_service
      com.docker.compose.project: compose_project

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  resource/local:
    attributes:
      - key: deployment.environment.name
        value: local
        action: upsert

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Prometheus 3 native OTLP ingestion (/api/v1/otlp/v1/metrics).
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  # Loki 3 native OTLP ingestion (/otlp/v1/logs).
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp, docker_stats]
      processors: [memory_limiter, resource/local, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/local, batch]
      exporters: [otlp_http/loki]
