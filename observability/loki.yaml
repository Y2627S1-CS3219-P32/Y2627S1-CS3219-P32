# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-11-04.
# Scope: Single-process local Loki on the filesystem, with OTLP ingestion. Author review: Pending.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP attributes that are not index labels are kept as structured metadata,
  # including trace_id and span_id.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
