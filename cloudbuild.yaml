# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-09-30.
# Scope: Cloud Build config that builds and pushes service images to Artifact Registry.
# Author review: Done.
# ChatGPT (GPT-6), 2026-11-04: build and publish mail-service image. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: mail-service and chat-service images get the `shared` build
# context too. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: sync-service and order-ranking-service images, and their
# migration (tooling) images, with the `shared` build context (logger, telemetry, Pub/Sub
# messaging). Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-11: deploy.sh now deploys order-ranking-service (and runs its
# tooling image's migrations); it does not deploy sync-service yet. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: the observability stack's images (observability/Dockerfile,
# one target each), which deploy.sh runs as one service with OBSERVABILITY=on.
# Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: merged main's agent-chat, agent-orchestrator and mandate
# images with the above; their Dockerfiles now copy shared/src from the root context.
# Author review: Pending.
#
# Usage (from the repository root):
#   gcloud builds submit --config cloudbuild.yaml
#
# Images are tagged with the build ID and `latest`. Deploying is handled by deploy.sh.
#
# Named build contexts require a recent BuildKit daemon and Dockerfile frontend.
#
# Claude Code (Opus 5.5), 2026-11-11: a build stuck under load (about 30 images build at once)
# fails at 30 minutes, not at the deploy workflow's 60; a normal build takes about 12.
# Author review: Pending.
timeout: 1800s

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: foc

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  # Claude Code (Opus 5.5), 2026-11-04: the frontend image also takes shared/src, for
  # telemetry.mts. Author review: Pending.
  - id: frontend-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        docker buildx create --driver docker-container --driver-opt image=moby/buildkit:v0.20.2 --use
        docker buildx build --load --build-context=shared=shared/src \
          -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:${BUILD_ID} \
          -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:latest \
          frontend-service

