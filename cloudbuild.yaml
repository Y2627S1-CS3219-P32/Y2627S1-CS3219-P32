# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-09-30.
# Scope: Cloud Build config that builds and pushes service images to Artifact Registry.
# Author review: Done.
# ChatGPT (GPT-6), 2026-11-04: build and publish mail-service image. Author review: Pending.
#
# Usage (from the repository root):
#   gcloud builds submit --config cloudbuild.yaml
#
# Images are tagged with the build ID and `latest`. Deploying is handled by deploy.sh.
#
# Claude Code (Opus 5.5), 2026-11-04: backend images take shared/src (the shared logger) as
# the `shared` build context. That flag needs buildx: this builder's own `docker build` is
# Docker 20.10 and has no --build-context. Author review: Pending.
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: foc

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  # Claude Code (Opus 5.5), 2026-11-04: the frontend image also takes shared/src, for
  # telemetry.mts. Author review: Pending.
  - id: frontend-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:latest
      - frontend-service

  - id: user-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/user-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/user-service:latest
      - user-service

  - id: mail-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/mail-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/mail-service:latest
      - mail-service

  - id: supplier-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service:latest
      - supplier-service

  # Drizzle tooling image, used by the supplier migrate and seed jobs.
  - id: supplier-service-tooling
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - --target=tooling
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service-tooling:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service-tooling:latest
      - supplier-service

  # Claude Code (Opus 5.5), 2026-10-18: order, notification, credit and saga services, with
  # tooling images for the Drizzle migration jobs. Author review: Pending.
  - id: order-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service:latest
      - order-service

  - id: order-service-tooling
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - --target=tooling
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service-tooling:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service-tooling:latest
      - order-service

  - id: notification-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service:latest
      - notification-service

  - id: notification-service-tooling
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - --target=tooling
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service-tooling:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service-tooling:latest
      - notification-service

  - id: credit-service
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/credit-service:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/credit-service:latest
      - credit-service

  - id: saga-orchestrator
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator:latest
      - saga-orchestrator

  - id: saga-orchestrator-tooling
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - buildx
      - build
      - --build-context=shared=shared/src
      - --target=tooling
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator-tooling:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator-tooling:latest
      - saga-orchestrator

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/frontend-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/user-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/user-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/mail-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/mail-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service-tooling:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/supplier-service-tooling:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service-tooling:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/order-service-tooling:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service-tooling:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/notification-service-tooling:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/credit-service:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/credit-service:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator-tooling:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/saga-orchestrator-tooling:latest
