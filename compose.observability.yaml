# AI Assistance Disclosure: Claude Code (Opus 5.5), 2026-11-04.
# Scope: Local observability stack: OpenTelemetry Collector, Prometheus, Loki, Tempo and
# Grafana. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: Mimir in place of Prometheus; the stack's images are
# built from observability/Dockerfile, as for Cloud Run. Author review: Pending.
#
# Usage, with the app:  docker compose -f compose.yaml -f compose.observability.yaml up -d --build
#        stack only (services run on the host), naming its services:
#          docker compose -f compose.yaml -f compose.observability.yaml up -d \
#            otel-collector mimir loki tempo grafana
#
# Claude Code (Opus 5.5), 2026-11-04: the app services below get an OTLP endpoint, which turns
# on shared/src/telemetry.mts in each. The file now needs compose.yaml alongside it, as it
# names the app's services. Author review: Pending.
# Claude Code (Opus 5.5), 2026-11-10: the chat, mail, order-ranking and sync services too.
# Author review: Pending.
#
# Host ports avoid the app's 3000-3004, 3333 and 543x. All bind to 127.0.0.1:
#   Grafana        http://127.0.0.1:3030   (admin / admin unless GRAFANA_ADMIN_* is set)
#   Mimir          http://127.0.0.1:9009   (Prometheus API under /prometheus)
#   OTLP gRPC      127.0.0.1:4317          (for services run on the host)
#   OTLP HTTP      127.0.0.1:4318
# Containers send OTLP to http://otel-collector:4318 (or otel-collector:4317 for gRPC).
# Loki and Tempo are reached only through Grafana, so they publish no host ports.
# Configuration is built into the images (observability/Dockerfile): after changing a file
# in observability/, rebuild with `up -d --build`.
x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Every 15 s; the SDK's default is 60 s.
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

x-otel-depends-on: &otel-depends-on
  otel-collector:
    condition: service_started

services:
  # The app's long-running services. Their service.name is OTEL_SERVICE_NAME where
  # compose.yaml sets one, otherwise the name in package.json.
  credit-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  credit-publisher:
    environment: *otel-environment
    depends_on: *otel-depends-on
  user-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  user-event-worker:
    environment: *otel-environment
    depends_on: *otel-depends-on
  supplier-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  supplier-event-worker:
    environment: *otel-environment
    depends_on: *otel-depends-on
  order-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  notification-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  saga-orchestrator:
    environment: *otel-environment
    depends_on: *otel-depends-on
  chat-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  mail-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  order-ranking-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  sync-service:
    environment: *otel-environment
    depends_on: *otel-depends-on
  frontend-service:
    environment:
      <<: *otel-environment
      # Its package.json name is foc-frontend-service, and the image does not include it.
      OTEL_SERVICE_NAME: frontend-service
    depends_on: *otel-depends-on

  otel-collector:
    build:
      context: ./observability
      target: otel-collector
    # With the Docker container metrics, which Cloud Run does not have.
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/local.yaml"]
    # Root only to read the Docker socket for container metrics.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
      - tempo

  mimir:
    build:
      context: ./observability
      target: mimir
    volumes:
      - mimir-data:/data/mimir
    ports:
      - "127.0.0.1:9009:9009"
    restart: unless-stopped

  loki:
    build:
      context: ./observability
      target: loki
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    build:
      context: ./observability
      target: tempo
    volumes:
      - tempo-data:/var/tempo
    restart: unless-stopped
    depends_on:
      - mimir

  grafana:
    build:
      context: ./observability
      target: grafana
    environment:
      # Grafana 13 limits anonymous users to Viewer, which cannot use Explore, so log in.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3030:3000"
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
      - tempo

volumes:
  mimir-data:
  loki-data:
  tempo-data:
  grafana-data:
