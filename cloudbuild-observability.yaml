# Builds and pushes only the images for the Cloud Run observability service.
timeout: 1200s

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: foc

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: observability-proxy
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=proxy
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-proxy:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-proxy:latest
      - observability

  - id: observability-grafana
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=grafana
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-grafana:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-grafana:latest
      - observability

  - id: observability-otel-collector
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=otel-collector
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-otel-collector:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-otel-collector:latest
      - observability

  - id: observability-mimir
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=mimir
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-mimir:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-mimir:latest
      - observability

  - id: observability-loki
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=loki
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-loki:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-loki:latest
      - observability

  - id: observability-tempo
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target=tempo
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-tempo:${BUILD_ID}
      - -t=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-tempo:latest
      - observability

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-proxy:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-proxy:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-grafana:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-grafana:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-otel-collector:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-otel-collector:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-mimir:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-mimir:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-loki:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-loki:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-tempo:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/observability-tempo:latest
