services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1::6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: [gcloud, beta, emulators, pubsub, start, --project=foc-local, '--host-port=0.0.0.0:8085']
    ports: ['127.0.0.1::8085']
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8085/v1/projects/foc-local/topics >/dev/null']
      interval: 2s
      timeout: 2s
      retries: 60
